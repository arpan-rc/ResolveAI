name: ResolveAI CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      FORCE_FALLBACK_MODE: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Type Check & Linting
        run: npm run lint

      - name: Run Deterministic Automated Unit Tests
        run: npm run test

      - name: Build Application (Frontend Vite + Backend Server Bundle)
        run: npm run build
